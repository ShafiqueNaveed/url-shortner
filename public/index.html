<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple URL Shortener</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 50px auto;
      text-align: center;
    }
    input {
      width: 80%;
      padding: 8px;
      margin-bottom: 10px;
    }
    button {
      padding: 8px 12px;
      cursor: pointer;
    }
    #result a {
      display: block;
      margin-top: 10px;
      color: blue;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <h2>🔗 URL Shortener</h2>
  <input type="text" id="longUrl" placeholder="Enter your long URL" />
  <button onclick="shorten()">Shorten</button>
  <p id="result"></p>

  <script>
  async function shorten() {

    const long = document.getElementById("longUrl").value;
    const resultDiv = document.getElementById("result");
    resultDiv.innerHTML = ""; // clear old result

    if (!long) {
      alert("Please enter a URL!");
      return;
    }

    try {
      const res = await fetch("/url", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ long })
      });

      const data = await res.json();
      
      if (data.error) {
        //  Server returned an error
        resultDiv.innerHTML = `<span style="color:red;">Error: ${data.error}</span>`;
      } else {
        //  Server returned a valid short URL
        resultDiv.innerHTML = `
          Short URL: <a href="/url?short=${data.short}" target="_blank">
            ${window.location.origin}/url?short=${data.short}
          </a>
        `;
      }

    } catch (err) {
      // In case the fetch itself fails (server down, etc.)
      resultDiv.innerHTML = `<span style="color:red;">Error: Unable to connect to the server.</span>`;
    }
  }
</script>

</body>

</html>
